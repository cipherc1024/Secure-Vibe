# rules/java.yaml — Java/Kotlin (Spring) security rules (regex engine)

- id: JAVA-001
  name: java_os_command_injection
  severity: high
  cwe: CWE-78
  message: "Runtime.exec/ProcessBuilder with concatenated user input (command injection risk) | Runtime.exec/ProcessBuilder 拼接用户输入（命令注入风险）"
  fix_hint: "Use ProcessBuilder(argsList) with an explicit argument list; whitelist user input; never concatenate command strings. | 用 ProcessBuilder(argsList) 参数列表直传，绝不把用户输入拼进命令字符串；用户输入先白名单校验。"
  match:
    regex:
      - >-
        (?i)Runtime\.getRuntime\(\)\.exec\s*\([^)]*(\+\s*\w+|\w+\s*\+\s*\w+)
      - >-
        (?i)new\s+ProcessBuilder\s*\(\s*(`|["'])sh\b
    exclude_regex:
      - >-
        ProcessBuilder\s*\(\s*(new\s+String\[\]|List\.of)


- id: JAVA-002
  name: java_jdbc_sql_concat
  severity: high
  cwe: CWE-89
  message: "JDBC Statement with concatenated SQL (SQL injection risk) | JDBC Statement 拼接 SQL（SQL 注入风险）"
  fix_hint: "Use PreparedStatement placeholders (setString/setInt); never concatenate user input into Statement.executeQuery. | 使用 PreparedStatement 占位符 \"?\"（setString/setInt 传参）；禁止把用户输入拼接进 Statement.executeQuery。"
  match:
    regex:
      - >-
        (?i)\.execute(Query|Update)\s*\([^)]*(\+\s*|\bString\.format\b|\bformat\s*\()
      - >-
        (?i)["'](SELECT|INSERT|UPDATE|DELETE)[^"']*["']\s*\+\s*\w+
    exclude_regex:
      - >-
        PreparedStatement|prepareStatement


- id: JAVA-003
  name: java_deserialization
  severity: high
  cwe: CWE-502
  message: "Java native deserialization used (ObjectInputStream.readObject - RCE risk) | 使用 Java 原生反序列化（ObjectInputStream.readObject，RCE 风险）"
  fix_hint: "Never deserialize untrusted data; use JSON (Gson/Jackson) instead. If serialization is required, apply a strict SerializationFilter whitelist. | 禁止反序列化不可信数据；用 JSON（Gson/Jackson）等安全格式；必须序列化时用 SerializationFilter 严格白名单。"
  match:
    regex:
      - >-
        (?i)new\s+ObjectInputStream\s*\(
    exclude_regex:
      - >-
        ObjectInputFilter


- id: JAVA-004
  name: java_xxe_parser
  severity: high
  cwe: CWE-611
  message: "XML parser does not disable external entities (XXE risk) | XML 解析器未禁用外部实体（XXE 风险）"
  fix_hint: "Set FEATURE_SECURE_PROCESSING and disable DOCTYPE/external entities on DocumentBuilderFactory/SAXParserFactory/XMLInputFactory. | DocumentBuilderFactory 设 FEATURE_SECURE_PROCESSING + 禁用 DOCTYPE/外部实体；或使用 SAXParserFactory 同样的安全配置。"
  match:
    regex:
      - >-
        (?i)(DocumentBuilderFactory|SAXParserFactory|XMLInputFactory)\s*\.\s*newInstance\s*\(
    exclude_regex:
      - >-
        FEATURE_SECURE_PROCESSING|disallow-doctype|setFeature


- id: JAVA-005
  name: java_insecure_random
  severity: medium
  cwe: CWE-338
  message: "java.util.Random / Math.random used for security-sensitive values (predictable randomness) | 使用 java.util.Random/Math.random 生成安全相关值（可预测随机数）"
  fix_hint: "Use java.security.SecureRandom for tokens and session IDs; Random/Math.random only for simulations. | 安全用途（token、会话 ID）用 java.security.SecureRandom；Random/Math.random 仅用于模拟等非安全场景。"
  match:
    regex:
      - >-
        (?i)new\s+Random\s*\([^)]*\)
      - >-
        \bMath\.random\s*\(\s*\)
    exclude_regex:
      - >-
        SecureRandom


- id: JAVA-006
  name: java_spring_actuator_exposure
  severity: medium
  cwe: CWE-200
  message: "Spring Boot Actuator exposes sensitive endpoints (information disclosure) | Spring Boot Actuator 暴露敏感端点（信息泄露）"
  fix_hint: "Restrict management.endpoints.web.exposure.include to health,info; never expose env/beans/heapdump/threaddump publicly. | 限制 management.endpoints.web.exposure.include 为 health,info；env/beans/heapdump/threaddump 等敏感端点禁止对公网开放。"
  match:
    regex:
      - >-
        (?i)management\.endpoints\.web\.exposure\.include\s*=\s*\*|env|beans|heapdump|threaddump
    exclude_regex: []


- id: JAVA-007
  name: java_ecb_cipher
  severity: medium
  cwe: CWE-327
  message: "ECB block cipher mode used (ciphertext pattern leakage) | 使用 ECB 分组模式（密文模式泄露风险）"
  fix_hint: "Use semantically secure modes (GCM/CTR/CBC); store passwords with PBKDF2/bcrypt instead of reversible ciphers. | 改用 GCM/CTR/CBC 等语义安全模式；密码存储用 PBKDF2/bcrypt，不用可逆加密。"
  match:
    regex:
      - >-
        (?i)"AES/ECB/|AES"/[^"]*ECB
    exclude_regex: []



- id: JAVA-008
  name: java_weak_hash
  severity: medium
  cwe: CWE-328
  literal_sensitive: true
  message: "Weak hash algorithm MD5/SHA1 (broken cryptographic hash) | 使用弱哈希算法 MD5/SHA1（已被破解的哈希）"
  fix_hint: "Use SHA-256 or stronger via MessageDigest.getInstance('SHA-256'); MD5/SHA1 are broken for security purposes. | 使用 SHA-256 或更强算法；MD5/SHA1 已不安全。"
  match:
    regex:
      - >-
        (?i)MessageDigest\.getInstance\s*\(\s*"(MD5|SHA-?1|MD4)"
    exclude_regex: []


- id: JAVA-009
  name: java_trust_all_certs
  severity: high
  cwe: CWE-295
  # multiline: the trust-all TrustManager/HostnameVerifier bodies span lines
  match:
    multiline: true
    regex:
      - >-
        (?i)(checkServerTrusted|checkClientTrusted|verify)\s*\([^)]*\)\s*\{\s*return\s*true
      - >-
        (?i)new\s+X509TrustManager\s*\(\s*\)
    exclude_regex:
      - >-
        return\s*false
  message: "Trust-all TrustManager/HostnameVerifier (TLS certificate validation bypass) | 信任所有证书的 TrustManager/HostnameVerifier（TLS 校验绕过）"
  fix_hint: "Remove the trust-all TrustManager/HostnameVerifier; use the default validator or pin the expected CA chain. | 删除信任所有证书的 TrustManager/HostnameVerifier；使用默认校验或固定 CA 链。"


- id: JAVA-010
  name: java_hardcoded_credentials
  severity: medium
  cwe: CWE-798
  literal_sensitive: true
  message: "Hardcoded credential (insufficiently protected credentials) | 硬编码凭据（凭据保护不足）"
  fix_hint: "Load credentials from environment variables or a secrets manager; never inline them in source. | 从环境变量或密钥管理服务读取凭据，不要写在源码里。"
  match:
    regex:
      - >-
        (?i)\b(password|passwd|secret|api[_-]?key|access[_-]?token)\b\s*=\s*"[^"]{8,}"
    exclude_regex:
      - >-
        System\.getenv|System\.getProperty|\$\{|\.{3,}|<[^">]|\*{3,}|your[_-]|example|placeholder|dummy
