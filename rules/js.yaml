# rules/js.yaml — JavaScript/Node security rules (regex engine; html inherits js)

- id: JS-001
  name: js_eval_new_function
  severity: high
  cwe: CWE-95
  message: "Use of eval / new Function to execute code dynamically (code injection risk) | 使用 eval / new Function 动态执行代码（代码注入风险）"
  fix_hint: "Never eval/new Function on untrusted input; parse data with JSON.parse; dispatch logic via object literals or Map. | 禁止 eval/new Function 处理不可信输入；解析数据用 JSON.parse，动态逻辑用对象字面量分发或 Map。"
  match:
    regex:
      - >-
        (?<![\w.$])eval\s*\(
      - >-
        new\s+Function\s*\(
    xast:
      call: [eval, Function]
    exclude_regex: []


- id: JS-002
  name: js_innerhtml_assignment
  severity: high
  cwe: CWE-79
  message: "Assignment of a non-literal value to innerHTML (DOM XSS risk) | 向 innerHTML 赋值非字面量（DOM XSS 风险）"
  fix_hint: "Use textContent for plain text; when HTML insertion is required, sanitize with DOMPurify or inject only whitelisted fragments. | 用 textContent 赋值纯文本；必须插入 HTML 时先经 DOMPurify 等库净化，或只拼接受控白名单片段。"
  match:
    regex:
      - >-
        \.\s*innerHTML\s*=\s*(?!=)(?!\s*["'`])(?!\s*`?\s*$)
    exclude_regex:
      - >-
        DOMPurify|sanitize|purify


- id: JS-003
  name: js_document_write
  severity: medium
  cwe: CWE-79
  message: "document.write used (XSS risk and parse blocking) | 使用 document.write 输出（XSS 风险，且阻塞解析）"
  fix_hint: "Use DOM APIs (createElement/textContent/appendChild) or update content via textContent; avoid document.write. | 用 DOM API（createElement/textContent/appendChild）或 textContent 更新内容，避免 document.write。"
  match:
    regex:
      - >-
        document\.write(ln)?\s*\(
    exclude_regex: []


- id: JS-004
  name: js_string_timer
  severity: high
  cwe: CWE-95
  message: "setTimeout/setInterval with a string argument (equivalent to eval) | setTimeout/setInterval 的参数为字符串（等价 eval，代码注入风险）"
  fix_hint: "Pass a function reference: setTimeout(fn, delay); never setTimeout(\"code\", ...). | 传函数引用而非字符串：setTimeout(fn, delay)；禁止 setTimeout(\"code\", ...)。"
  match:
    regex:
      - >-
        set(Timeout|Interval)\s*\(\s*["'`]
    xast:
      call: [setTimeout, setInterval]
      arg: string-literal
    exclude_regex: []


- id: JS-005
  name: js_postmessage_wildcard
  severity: medium
  cwe: CWE-346
  # literal_sensitive: the wildcard "*" appears as a string argument
  literal_sensitive: true
  message: "postMessage with a wildcard target origin (messages can go to any domain) | postMessage 使用通配符目标源（跨源消息可发给任意域）"
  fix_hint: "Set targetOrigin to an explicit origin (e.g. \"https://app.example.com\"); never \"*\"; the receiver must validate event.origin. | targetOrigin 指定明确的源（如 \"https://app.example.com\"），禁止 \"*\"；接收端必须校验 event.origin。"
  match:
    regex:
      - >-
        postMessage\s*\([^)]*,\s*["']\*["']
    exclude_regex: []


- id: JS-006
  name: node_child_process_exec_string
  severity: high
  cwe: CWE-78
  message: "child_process.exec/execSync runs a concatenated command string (command injection risk) | child_process.exec/execSync 以拼接字符串执行命令（命令注入风险）"
  fix_hint: "Use execFile/spawn with argument lists; never exec(\"...\" + user) or exec(\"sh -c \" + user); escape or whitelist user input. | 改用 execFile/spawn 参数列表传参；禁止 exec(`\"...\" + user`)、exec(\"sh -c \" + user)；用户输入必须转义或白名单。"
  match:
    regex:
      - >-
        (?i)\b(exec|execSync)\s*\([^)]*\+
      - >-
        (?i)\b(exec|execSync)\s*\([^)]*(req\.(query|body|params)|process\.argv)
    exclude_regex: []


- id: JS-007
  name: node_unescaped_output
  severity: high
  cwe: CWE-79
  message: "Request parameters echoed directly (res.send/res.end reflected XSS) | 把请求参数直接回显（res.send/res.end 反射型 XSS）"
  fix_hint: "Escape or rely on template auto-escaping before echoing user input; use res.json for data endpoints. | 回显用户输入前先转义或用模板引擎自动转义；JSON 接口返回 JSON，HTML 接口必须 HTML 转义。"
  match:
    regex:
      - >-
        (?i)res\.(send|end|write)\s*\([^)]*(req\.(query|params|body)|req\.query)
    exclude_regex:
      - >-
        json\.stringify|escapeHtml|sanitize|encodeURI


- id: JS-008
  name: js_prototype_pollution
  severity: high
  cwe: CWE-1321
  message: "User JSON recursively merged into objects (prototype pollution risk) | 把用户 JSON 递归合并进对象（原型污染风险）"
  fix_hint: "Filter __proto__/constructor/prototype keys during deep merges; use Object.create(null) or field whitelists; never Object.assign({}, JSON.parse(userInput)). | 深层合并时过滤 __proto__/constructor/prototype 键；用 Object.create(null) 或 whitelist 字段；禁止 Object.assign({}, JSON.parse(userInput))。"
  match:
    regex:
      - >-
        (?i)(Object\.assign|\.extend|merge|deepMerge)\s*\([^)]*(JSON\.parse|req\.(query|body|params)|\bdata\b)
      - >-
        (?i)__proto__|\[["']constructor["']\]\s*:
    exclude_regex: []


- id: JS-009
  name: node_dynamic_require
  severity: medium
  cwe: CWE-98
  message: "Dynamic expression passed to require/import (remote file loading risk) | 使用动态表达式 require/import（远程文件加载风险）"
  fix_hint: "Never require(user input) or import(dynamic concatenation); map dynamic loads to static modules via a fixed whitelist. | 禁止 require(用户输入) 或 import(动态拼接)；要动态加载用固定白名单映射到静态模块。"
  match:
    regex:
      - >-
        (?i)\brequire\s*\([^)]*(req\.(query|body|params)|\+\s*\w+|process\.argv)
      - >-
        \brequire\s*\(\s*[A-Za-z_$][\w$]*\s*\)
    xast:
      call: require
      arg: dynamic
    exclude_regex: []



- id: JS-010
  name: js_sql_template_literal
  severity: high
  cwe: CWE-89
  # literal_sensitive: template-string contents are blanked by strip_code, so
  # the ${...} interpolation marker must be matched against the raw line
  literal_sensitive: true
  message: "SQL built with a template literal / concatenation (SQL injection risk) | 用模板字符串/拼接构造 SQL（SQL 注入风险）"
  fix_hint: "Use parameterized queries (mysql.format / pg parameter placeholders ?) instead of interpolating user input into SQL. | 使用参数化查询（mysql.format 或 pg 的 ? 占位符），不要把用户输入插进 SQL。"
  match:
    regex:
      - >-
        (?i)\.(query|execute)\s*\(\s*`[^`]*\$\{
      - >-
        (?i)\b(sql|query|statement)\w*\s*=\s*`[^`]*\$\{
    exclude_regex:
      - >-
        format\s*\(|sqlstring


- id: JS-011
  name: js_tls_reject_unauthorized
  severity: high
  cwe: CWE-295
  message: "TLS certificate validation disabled (rejectUnauthorized: false allows MITM) | TLS 证书校验被禁用（rejectUnauthorized: false 可被中间人攻击）"
  fix_hint: "Remove rejectUnauthorized: false (the default validates certificates); for self-signed test servers pin the CA bundle instead. | 删除 rejectUnauthorized: false（默认即校验证书）；自签名测试服务器应固定 CA 证书包，而不是关闭校验。"
  match:
    regex:
      - >-
        rejectUnauthorized\s*[:=]\s*false
      - >-
        NODE_TLS_REJECT_UNAUTHORIZED\s*[,=]\s*["']?0
    exclude_regex: []


- id: JS-012
  name: js_weak_hash
  severity: medium
  cwe: CWE-328
  literal_sensitive: true
  message: "Weak hash algorithm MD5/SHA1 used (broken cryptographic hash) | 使用弱哈希算法 MD5/SHA1（已被破解的哈希）"
  fix_hint: "Use SHA-256 or stronger (crypto.createHash('sha256')); MD5/SHA1 are broken for security purposes. | 使用 SHA-256 或更强算法（crypto.createHash('sha256')）；MD5/SHA1 已不安全。"
  match:
    regex:
      - >-
        createHash\s*\(\s*["'](md5|sha1|md4)["']
    exclude_regex: []


- id: JS-013
  name: js_insecure_random_token
  severity: medium
  cwe: CWE-338
  message: "Math.random used for a security-sensitive value (predictable randomness) | 用 Math.random 生成安全相关值（可预测随机数）"
  fix_hint: "Use crypto.getRandomValues or crypto.randomBytes for tokens, nonces and secrets; Math.random is not cryptographically secure. | token/nonce/secret 用 crypto.getRandomValues 或 crypto.randomBytes；Math.random 不具备密码学安全性。"
  match:
    regex:
      - >-
        (?i)\b(token|password|secret|otp|nonce|captcha|session[_-]?id|api[_-]?key|reset[_-]?code|verify[_-]?code)\w*\s*[:=][^;\n]{0,40}Math\.random\s*\(\s*\)
    exclude_regex:
      - >-
        getRandomValues|crypto\.random


- id: JS-014
  name: js_hardcoded_secret
  severity: medium
  cwe: CWE-798
  literal_sensitive: true
  message: "Hardcoded credential (insufficiently protected credentials) | 硬编码凭据（凭据保护不足）"
  fix_hint: "Load credentials from environment variables (process.env) or a secrets manager; never inline them in source. | 从环境变量（process.env）或密钥管理服务读取凭据，不要写在源码里。"
  match:
    regex:
      - >-
        (?i)\b(api[_-]?key|apikey|secret|password|passwd|access[_-]?token|auth[_-]?token|private[_-]?key)\b\s*[:=]\s*["'][^"']{8,}["']
    exclude_regex:
      - >-
        process\.env|typeof|\$\{|["'][x*]{3,}["']|your[_-]|example|placeholder|dummy|<[^"']*["']


- id: JS-015
  name: js_open_redirect
  severity: high
  cwe: CWE-601
  message: "Redirect to a request-supplied URL (open redirect risk) | 重定向到请求传入的 URL（开放重定向风险）"
  fix_hint: "Validate the target against a host whitelist before redirecting; never res.redirect(req.query.url) directly. | 重定向前按域名白名单校验目标 URL；禁止 res.redirect(req.query.url) 直接跳转。"
  match:
    regex:
      - >-
        (?i)res\.redirect\s*\([^)]*req\.(query|body|params)
    exclude_regex:
      - >-
        encodeURIComponent|whitelist|allowlist|startsWith|includes


- id: JS-016
  name: js_fs_path_traversal
  severity: medium
  cwe: CWE-22
  message: "File operation with a request-supplied path (path traversal risk) | 文件操作使用请求传入的路径（路径穿越风险）"
  fix_hint: "Resolve the path and verify it stays inside the base directory; use path.basename on the user segment; never pass req params to fs calls directly. | 解析路径并确认仍位于基目录内；用户段用 path.basename 处理；禁止把 req 参数直接传给 fs。"
  match:
    regex:
      - >-
        (?i)\b(readFile|readFileSync|writeFile|writeFileSync|createReadStream|createWriteStream|unlink|unlinkSync|appendFile)\s*\([^)]*req\.(query|params|body)
      - >-
        (?i)path\.join\s*\([^)]*req\.(query|params|body)
    exclude_regex:
      - >-
        path\.basename|sanitize


- id: JS-017
  name: js_jwt_none_alg
  severity: high
  cwe: CWE-347
  literal_sensitive: true
  message: "JWT verified with the 'none' algorithm (signature bypass risk) | JWT 使用 none 算法校验（签名绕过风险）"
  fix_hint: "Never accept alg: none; pin the expected algorithm (e.g. algorithms: ['HS256']) when verifying. | 禁止接受 alg: none；校验时固定预期算法（如 algorithms: ['HS256']）。"
  match:
    regex:
      - >-
        (?i)algorithms?\s*:\s*\[[^\]]*["']none["']
      - >-
        (?i)algorithms?\s*:\s*["']none["']
    exclude_regex: []
